<!doctype html>
<meta charset="utf-8">
<title>ceangal pixel harness</title>
<body>
<script type="module">
import { start } from "/hosts/web/host.js";

const q = new URLSearchParams(location.search);
const width = Number(q.get("w") || 800), height = Number(q.get("h") || 600), scale = Number(q.get("scale") || 1);
const assets = JSON.parse(q.get("assets") || "{}");

// Same script vocabulary as the native headless host (ceangal/native/host.rs).
async function runScript(host, script) {
  for (const cmd of script.split(";").map((s) => s.trim()).filter(Boolean)) {
    const sp = cmd.indexOf(" ");
    const name = sp < 0 ? cmd : cmd.slice(0, sp), arg = sp < 0 ? "" : cmd.slice(sp + 1);
    const n = arg.split(/\s+/).map(Number);
    if (name === "click") host.click(n[0], n[1]);
    else if (name === "down") host.dispatch(4, 0, 0, n[0], n[1], 1, 0);
    else if (name === "move") host.dispatch(4, 1, 0, n[0], n[1], 1, 0);
    else if (name === "up") host.dispatch(4, 2, 0, n[0], n[1], 0, 0);
    else if (name === "wheel") host.dispatch(5, 0, 1, n[0], n[1], n[2], n[3]);
    else if (name === "key") host.key(n[0], n[1] || 0);
    else if (name === "text") host.text(arg, 0);
    else if (name === "paste") host.text(arg, 3);
    else if (name === "preedit") host.withEvent(new TextEncoder().encode(arg), () => host.dispatch(7, 1, new TextEncoder().encode(arg).length));
    else if (name === "preedit_end") host.withEvent(new Uint8Array(0), () => host.dispatch(7, 2, 0));
    else if (name === "bench") {
      const count = Math.max(1, n[0] || 60), dy = isNaN(n[1]) ? 37 : n[1];
      const times = [];
      for (let i = 0; i < count; i++) {
        const t0 = performance.now();
        host.dispatch(5, 0, 1, width / 2, height / 2, 0, dy);
        host.dispatch(3, 0, 0, i * 16);
        await host.device.queue.onSubmittedWorkDone();
        times.push(performance.now() - t0);
      }
      times.sort((a, b) => a - b);
      window.__bench = { frames: times.length, avg_ms: times.reduce((a, b) => a + b, 0) / times.length, p95_ms: times[Math.min(times.length - 1, Math.floor(times.length * 0.95))], max_ms: times[times.length - 1] };
    }
    else if (name === "frames") { for (let i = 0; i < Math.max(1, n[0]); i++) host.dispatch(3, 0, 0, i * 16); }
    await host.settle();
  }
}

window.__run = async () => {
  const errors = [];
  // every font up front: a screenshot must not depend on when a lazy one lands
  const host = await start({ canvas: null, wasm: q.get("wasm"), assets, lazy: () => false, headless: { width, height, scale }, onError: (e) => errors.push(String(e)) });
  await host.settle();
  await runScript(host, q.get("script") || "");
  const snap = await host.snapshot();
  if (errors.length) throw new Error(errors.join("\n"));
  let s = "";
  for (let i = 0; i < snap.rgba.length; i += 0x8000) s += String.fromCharCode.apply(null, snap.rgba.subarray(i, i + 0x8000));
  return { width: snap.width, height: snap.height, rgba: btoa(s), bench: window.__bench || null };
};
</script>
