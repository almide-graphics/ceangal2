<!doctype html>
<meta charset="utf-8">
<title>playground e2e</title>
<body>
<script type="module">
// Drives the built playground (dist/web) through its accessibility tree:
// every lookup is by the label a screen reader would announce.
import { start } from "/dist/web/host.js";
import { playgroundOptions } from "/dist/web/boot.js";

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let host = null;
const errors = [];

window.pg = {
  async boot({ width = 1200, height = 760, scale = 1, launch = "" } = {}) {
    const opts = await playgroundOptions({ base: "/dist/web/" });
    host = await start({ ...opts, canvas: null, headless: { width, height, scale }, launch, onError: (e) => errors.push(String(e)) });
    await host.settle();
    return true;
  },
  errors: () => errors,
  host: () => host,
  nodes: () => (host.a11yNodes || []).map((n) => ({ ...n })),
  find(label) { return (host.a11yNodes || []).find((n) => n.label === label) || null; },
  value(label) { return this.find(label)?.value ?? null; },
  texts() { return (host.a11yNodes || []).filter((n) => n.role === 4).map((n) => n.label); },
  async click(label) {
    const n = this.find(label);
    if (!n) throw new Error(`no node labelled ${JSON.stringify(label)}; have ${JSON.stringify(this.nodes().map((m) => m.label).filter(Boolean))}`);
    host.click(n.x + n.w / 2, n.y + n.h / 2);
    await host.settle();
  },
  async key(code, mods = 0) { host.key(code, mods); await host.settle(); },
  async type(s) { host.text(s, 0); await host.settle(); },
  // Polls `pred` (a function source) between frames until it is truthy.
  async until(pred, timeoutMs = 30000) {
    const f = new Function("pg", `return (${pred})(pg)`);
    const t0 = performance.now();
    for (;;) {
      await host.settle();
      const v = f(this);
      if (v) return v;
      if (performance.now() - t0 > timeoutMs) throw new Error(`timed out waiting for ${pred}; texts: ${JSON.stringify(this.texts())}`);
      await sleep(50);
    }
  },
  async snapshot() {
    const snap = await host.snapshot();
    let s = "";
    for (let i = 0; i < snap.rgba.length; i += 0x8000) s += String.fromCharCode.apply(null, snap.rgba.subarray(i, i + 0x8000));
    return { width: snap.width, height: snap.height, rgba: btoa(s) };
  },
};
// AI provider mock: each call to an AI API pops the next scripted reply
// (a list of text deltas, sent as Anthropic-style SSE in awkward chunks that
// split lines and UTF-8 sequences), or hangs until aborted when it is "hang".
const realFetch = window.fetch.bind(window);
window.aiCalls = [];
window.pg.mockAI = (replies) => {
  const queue = [...replies];
  window.fetch = (url, init = {}) => {
    if (!/api\.anthropic\.com|api\.openai\.com|googleapis\.com/.test(String(url))) return realFetch(url, init);
    window.aiCalls.push({ url: String(url), headers: init.headers, body: JSON.parse(new TextDecoder().decode(init.body)) });
    const reply = queue.shift();
    if (reply === "hang") return new Promise((_, reject) => init.signal?.addEventListener("abort", () => reject(new DOMException("aborted", "AbortError"))));
    if (reply && reply.status) return Promise.resolve(new Response(reply.body, { status: reply.status }));
    const sse = (reply || []).map((t) => `event: content_block_delta\ndata: ${JSON.stringify({ type: "content_block_delta", index: 0, delta: { type: "text_delta", text: t } })}\n\n`).join("") + "data: [DONE]\n\n";
    const bytes = new TextEncoder().encode(sse);
    let i = 0;
    const stream = new ReadableStream({ pull(ctrl) { if (i >= bytes.length) return ctrl.close(); const n = 7 + (i % 13); ctrl.enqueue(bytes.slice(i, i + n)); i += n; } });
    return Promise.resolve(new Response(stream, { status: 200, headers: { "content-type": "text/event-stream" } }));
  };
};
// Downloads (file_save) are captured instead of saved.
window.downloads = [];
const realCreate = URL.createObjectURL.bind(URL);
URL.createObjectURL = (blob) => { window.downloads.push(blob); return realCreate(blob); };
window.pg.lastDownload = async () => {
  const b = window.downloads.at(-1);
  if (!b) return null;
  const u8 = new Uint8Array(await b.arrayBuffer());
  let s = ""; for (const x of u8) s += String.fromCharCode(x);
  return btoa(s);
};
window.__ready = true;
</script>
