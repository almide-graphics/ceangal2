<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almide Playground</title>
<meta name="description" content="Write, run, and share Almide — right in your browser">
<meta name="theme-color" content="#0b1420">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #0b1420; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #unsupported { display: none; color: #f4f7f8; font: 15px/1.5 system-ui, sans-serif; padding: 32px; max-width: 560px; }
</style>
<canvas id="app" aria-label="Almide Playground"></canvas>
<p id="crashed" role="alert" style="display:none;position:fixed;left:16px;bottom:16px;margin:0;padding:12px 16px;border-radius:8px;background:#d94f5e;color:#f0e8e9;font:14px/1.4 system-ui,sans-serif;z-index:100">The playground stopped unexpectedly. <a href="" style="color:inherit;font-weight:600">Reload</a> — your tabs are saved.</p>
<p id="unsupported">The Almide Playground needs WebGPU. Use a current version of Chrome, Edge, Safari or Firefox with WebGPU turned on.</p>
<script type="module">
import { start, UnsupportedError } from "./host.js";
import { playgroundOptions } from "./boot.js";

try {
  window.ceangal = await start({ ...(await playgroundOptions()), canvas: document.getElementById("app"), onError: (e) => {
    console.error(e);
    document.getElementById("crashed").style.display = "block";
  } });
} catch (e) {
  if (!(e instanceof UnsupportedError)) throw e;
  document.getElementById("app").remove();
  document.getElementById("unsupported").style.display = "block";
}
</script>
