# Flatpak manifest. tools/build_flatpak.sh stages the sources next to a copy
# of this file (out/flatpak/): the exported Rust project (src/), the vendored
# crates (cargo-sources.json, from flatpak-cargo-generator) and the assets.
# The build itself is offline.
id: dev.almide.playground
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: almide-playground
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # the AI assistant calls the provider the user picked
  - --share=network
  # API keys go to the Secret Service (keyring)
  - --talk-name=org.freedesktop.secrets
  - --env=CEANGAL_ASSETS=/app/share/almide-playground/assets
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/almide-playground/cargo
    CARGO_NET_OFFLINE: 'true'
    CEANGAL_APP_ID: dev.almide.playground
modules:
  - name: almide-playground
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --manifest-path src/app/Cargo.toml
      - install -Dm755 src/app/target/release/almide-out /app/bin/almide-playground
      - mkdir -p /app/share/almide-playground/assets
      - cp -R assets/. /app/share/almide-playground/assets/
      - install -Dm644 linux/dev.almide.playground.desktop /app/share/applications/dev.almide.playground.desktop
      - install -Dm644 linux/dev.almide.playground.metainfo.xml /app/share/metainfo/dev.almide.playground.metainfo.xml
      - for s in 64 128 256 512; do install -Dm644 icons/${s}x${s}.png /app/share/icons/hicolor/${s}x${s}/apps/dev.almide.playground.png; done
    sources:
      - type: dir
        path: stage
      # almide's crates read ../../{stdlib,runtime} from their build scripts
      # (almide/almide#3361): unpack the matching source tree where
      # vendor/<crate>/../.. lands.
      - type: archive
        url: https://github.com/almide/almide/archive/refs/tags/v0.66.0.tar.gz
        sha256: 774e27032a2beb6c89e17361256c9c25f96563fee78649bf06adf5a4f129c426
        dest: cargo
      - cargo-sources.json
