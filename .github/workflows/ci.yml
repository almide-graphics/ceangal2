name: ci

# TEMPORARY probe (not for merge): which `mut Bytes` shape makes
# snaidhm.vector.rasterize_svg slow on wasm from 0.67 on. Each repro (4 MB
# buffer, 20,000 calls) runs on wasm, then natively, 300 s cap.
on:
  pull_request:

jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { almide: cdfd3dc378554261ab28ff4246debf222f1476d8 }
    name: ${{ matrix.almide }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install coreutils || true
      - name: almide
        run: |
          if [[ "${{ matrix.almide }}" == 0.6* ]]; then
            mkdir -p "$RUNNER_TEMP/a" && curl -fsSL "https://github.com/almide/almide/releases/download/v${{ matrix.almide }}/almide-macos-aarch64.tar.gz" | tar xz -C "$RUNNER_TEMP/a"
            echo "A=$RUNNER_TEMP/a/almide-macos-aarch64/almide" >> "$GITHUB_ENV"
          else
            cargo install --locked --git https://github.com/almide/almide --rev "${{ matrix.almide }}" almide --root "$RUNNER_TEMP/dev"
            echo "A=$RUNNER_TEMP/dev/bin/almide" >> "$GITHUB_ENV"
          fi
      - name: time each repro
        working-directory: comp
        run: |
          set +e
          "$A" --version
          for f in k0_loops_8_params.almd k1_17_params.almd k2_match_grad.almd k3_blend.almd k4_verbatim.almd l1_line_acc.almd; do
            for t in wasm native; do
              args=""; [ $t = wasm ] && args="--target wasm"
              s=$(date +%s)
              gtimeout 300 "$A" run "$f" $args > out.txt 2>&1; rc=$?
              tail -3 out.txt
              echo "RESULT $f $t exit=$rc seconds=$(( $(date +%s) - s ))"
            done
          done
