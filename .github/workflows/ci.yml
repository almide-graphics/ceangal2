name: ci

on:
  pull_request:

jobs:
  wasm-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: each standalone file, check and wasm build on Almide v0.69.0
        run: |
          tools/almide --version
          rc=0
          for f in repro/*.almd; do
            echo "::group::$f"
            tools/almide check "$f" || rc=1
            tools/almide build "$f" --target wasm -o "/tmp/$(basename "$f" .almd).wasm" || { echo "WASM BUILD FAILED: $f"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
