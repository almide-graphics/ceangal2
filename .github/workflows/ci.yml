name: ci

# TEMPORARY probe (not for merge): editor-10k-scrolled frame time and pixels
# per frame-work step, on almide with #4555 + #4556 (PR #4556 head).
on:
  pull_request:

env:
  ALMIDE_SHA: eac2999b869ecaa272f3f79ab5ff34bc023503a2

jobs:
  almide:
    runs-on: macos-15
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked --git https://github.com/almide/almide --rev "$ALMIDE_SHA" almide --root "$RUNNER_TEMP/dev"
      - uses: actions/upload-artifact@v4
        with: { name: almide-dev, path: "${{ runner.temp }}/dev/bin/almide" }

  pixel:
    needs: almide
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        step: [before, step4, step1, step2]
        rep: [1, 2]
        include:
          - { step: before, ref: 7b93b54 }
          - { step: step4, ref: 7f670fc }
          - { step: step1, ref: ef6e7c7 }
          - { step: step2, ref: 0e71f06 }
    name: pixel ${{ matrix.step }} \#${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: frame-work, fetch-depth: 0 }
      - run: git checkout ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with: { name: almide-dev, path: "${{ runner.temp }}/dev" }
      - name: toolchain
        run: |
          echo dev > .almide-version
          mkdir -p .tools/dev/almide-macos-aarch64
          cp "$RUNNER_TEMP/dev/almide" .tools/dev/almide-macos-aarch64/almide
          chmod +x .tools/dev/almide-macos-aarch64/almide
          tools/almide --version
      - name: web vs native pixels
        continue-on-error: true
        run: node tests/pixel/run.mjs 2>&1 | tee pixel.txt
      - if: always()
        run: grep -E 'bench:|^FAIL|^ok' pixel.txt || true; (cd out/pixel && shasum -a 256 *.png) | tee shas.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "pixel-${{ matrix.step }}-${{ matrix.rep }}", path: "shas.txt" }
