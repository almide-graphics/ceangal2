name: ci

# TEMPORARY probe (not for merge): almide#4580 / #4581 — does keeping the
# tail position of a bytes linked call on wasm fix the rasterize_svg hang in the
# web E2E, and what does editor-10k-scrolled read? base = develop fc3bd3c51,
# pr = #4581 head.
on:
  push:
    branches: [probe/mutparam-4581]

jobs:
  almide:
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - { name: base, rev: fc3bd3c51fe05b5c1a8af69d91aea74d243c2746 }
          - { name: pr, rev: cdfd3dc378554261ab28ff4246debf222f1476d8 }
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked --git https://github.com/almide/almide --rev "${{ matrix.rev }}" almide --root "$RUNNER_TEMP/dev"
      - run: '"$RUNNER_TEMP/dev/bin/almide" --version'
      - uses: actions/upload-artifact@v4
        with: { name: "almide-${{ matrix.name }}", path: "${{ runner.temp }}/dev/bin/almide" }

  pixel:
    needs: almide
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        name: [base, pr]
    name: pixel @ ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with: { name: "almide-${{ matrix.name }}", path: "${{ runner.temp }}/dev" }
      - name: toolchain
        run: |
          echo dev > .almide-version
          mkdir -p .tools/dev/almide-macos-aarch64
          cp "$RUNNER_TEMP/dev/almide" .tools/dev/almide-macos-aarch64/almide
          chmod +x .tools/dev/almide-macos-aarch64/almide
          tools/almide --version
      - name: web vs native pixels (editor-10k-scrolled bench)
        continue-on-error: true
        run: node tests/pixel/run.mjs 2>&1 | tee pixel.txt
      - name: summary
        if: always()
        run: grep -E 'bench:|^FAIL|^ok' pixel.txt || true

  web:
    needs: almide
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: base, rev: fc3bd3c51fe05b5c1a8af69d91aea74d243c2746 }
          - { name: pr, rev: cdfd3dc378554261ab28ff4246debf222f1476d8 }
    name: web E2E @ ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen-cli@0.2.129 }
      - run: brew install coreutils || true
      - uses: actions/download-artifact@v4
        with: { name: "almide-${{ matrix.name }}", path: "${{ runner.temp }}/dev" }
      - name: toolchain (CLI and the playground's compiler crate at the same rev)
        run: |
          echo dev > .almide-version
          mkdir -p .tools/dev/almide-macos-aarch64
          cp "$RUNNER_TEMP/dev/almide" .tools/dev/almide-macos-aarch64/almide
          chmod +x .tools/dev/almide-macos-aarch64/almide
          tools/almide --version
          sed -i '' -E 's|(almide(-mir)? = \{ git = "https://github.com/almide/almide.git", )tag = "v0.69.0"|\1rev = "${{ matrix.rev }}"|' apps/playground/compiler/Cargo.toml
          grep -n 'almide' apps/playground/compiler/Cargo.toml
          (cd apps/playground/compiler && (cargo update -p almide -p almide-mir || cargo generate-lockfile))
      - name: build dist/web
        run: tools/build_web.sh
      - name: playground E2E (20 min cap)
        continue-on-error: true
        run: SKIP_BUILD=1 gtimeout 1200 node tests/e2e/web.mjs 2>&1 | tee web.txt; echo "exit=${PIPESTATUS[0]}" | tee -a web.txt
      - name: summary
        if: always()
        run: grep -E '^ok|^FAIL|exit=' web.txt || true
