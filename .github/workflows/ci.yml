name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: bindings are generated from the manifest
        run: python3 tools/gen_bindings.py && git diff --exit-code
      - run: node tests/abi_conformance.mjs
      - name: the API reference is generated from the sources (docs/api)
        run: python3 tools/gen_api_docs.py --check

  almide-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: layout engine (Yoga-derived)
        working-directory: ceangal
        run: ../tools/almide test src/layout_test.almd
      - name: bidi levels and display order (tests/bidi/cases.txt, from unicode-bidi)
        working-directory: ceangal
        run: ../tools/almide test src/bidi_test.almd
      - name: line breaking matches Unicode's LineBreakTest.txt (tests/linebreak/cases.txt)
        working-directory: ceangal
        run: ../tools/almide test src/linebreak_test.almd
      - name: Arabic shaping matches HarfBuzz (tests/shaping/arabic.txt)
        working-directory: ceangal
        run: ../tools/almide test src/arabic_test.almd --target wasm
      - name: font engine
        working-directory: snaidhm
        run: ../tools/almide test src/font_test.almd
      - name: Indic shaping matches HarfBuzz (tests/shaping/indic.txt)
        working-directory: ceangal
        run: ../tools/almide test src/indic_test.almd --target wasm
      - name: playground units
        working-directory: apps/playground
        run: ../../tools/almide test src/deflate_test.almd && ../../tools/almide test src/zip_test.almd
      - name: the ceangal CLI
        working-directory: cli
        run: ../tools/almide check
      - name: the guide's code examples compile (docs/guide)
        run: python3 tools/check_doc_examples.py
      - name: wasm check (every app)
        run: |
          for app in apps/*/; do
            (cd "$app" && ../../tools/almide check --target wasm src/main.almd)
          done

  pixel-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/*/.almide
          key: almide-native-${{ runner.os }}-${{ hashFiles('.almide-version', '**/almide.toml') }}
      - name: web vs native pixels
        run: node tests/pixel/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-macos
          path: out/pixel/*.png

  # The native playground: compiler crate + wasmi linked in, headless E2E
  # (run, check, stop, examples, visual, Rust/AST, export, the Todo window,
  # every fixture and example byte-identical with the CLI).
  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: native-playground-${{ runner.os }}-${{ hashFiles('.almide-version', 'apps/playground/compiler/Cargo.lock') }}
      - run: tools/build_native.sh
      - run: node tests/e2e/native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-native-macos
          path: out/e2e-native/*.png

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: software Vulkan (lavapipe) for headless rendering
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: native-playground-${{ runner.os }}-${{ hashFiles('.almide-version', 'apps/playground/compiler/Cargo.lock') }}
      - run: tools/build_native.sh
      - run: node tests/e2e/native.mjs
      - name: ceangal test native (the Todo app's tests, headless on lavapipe)
        run: tools/ceangal test native --app apps/todo
      - name: ceangal dev (linux) — an edit restarts the app (a virtual X display)
        run: |
          sudo apt-get install -y xvfb libxkbcommon-x11-0 >/dev/null
          xvfb-run -a node tests/e2e/dev.mjs --desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-native-linux
          path: out/e2e-native/*.png

  # Headless rendering uses wgpu's DX12 software adapter (WARP).
  native-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: native-playground-${{ runner.os }}-${{ hashFiles('.almide-version', 'apps/playground/compiler/Cargo.lock') }}
      - run: tools/build_native.sh -o out/playground.exe
      - run: node tests/e2e/native.mjs --bin out/playground.exe
      - name: ceangal test native (the Todo app's tests, headless on WARP)
        run: tools/ceangal test native --app apps/todo
      - name: ceangal dev (windows) — an edit restarts the app
        run: node tests/e2e/dev.mjs --desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-native-windows
          path: out/e2e-native/*.png
      # Microsoft Store: MSIX (signed with the Partner Center certificate from
      # secrets, or a trusted test certificate) through the Windows App
      # Certification Kit.
      - name: MSIX + Windows App Certification Kit
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: tools/package_msix.ps1 -Exe out/playground.exe -Wack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix
          path: |
            out/msix/playground.msix
            out/msix/wack-report.xml

  # Mac App Store: universal (arm64 + x86_64) app with App Sandbox, signed
  # with the distribution identity from secrets when present (ad hoc
  # otherwise), installer pkg; the sandboxed app is launched once.
  macos-store:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: macos-store-${{ hashFiles('.almide-version', 'apps/playground/compiler/Cargo.lock') }}
      - name: signing identities (when the secrets exist)
        env:
          CERTS_P12_B64: ${{ secrets.MAC_CERTS_P12_B64 }}
          CERTS_PASS: ${{ secrets.MAC_CERTS_PASS }}
          PROFILE_B64: ${{ secrets.MAC_PROVISIONING_PROFILE_B64 }}
        run: |
          if [ -n "$CERTS_P12_B64" ]; then
            kc="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p ci "$kc" && security unlock-keychain -p ci "$kc"
            echo "$CERTS_P12_B64" | base64 -d > "$RUNNER_TEMP/certs.p12"
            security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$CERTS_PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
            security list-keychains -d user -s "$kc"
            echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/app.provisionprofile"
            echo "MAC_PROVISIONING_PROFILE=$RUNNER_TEMP/app.provisionprofile" >> "$GITHUB_ENV"
            echo "MAC_APP_IDENTITY=${{ secrets.MAC_APP_IDENTITY }}" >> "$GITHUB_ENV"
            echo "MAC_INSTALLER_IDENTITY=${{ secrets.MAC_INSTALLER_IDENTITY }}" >> "$GITHUB_ENV"
          fi
      - run: tools/package_macos.sh
      - name: the sandboxed app starts
        run: CEANGAL_EXIT_AFTER_MS=3000 "out/macos/Almide Playground.app/Contents/MacOS/playground"
      - name: validate for the App Store (needs App Store Connect API key)
        if: env.ASC_KEY_ID != ''
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --validate-app -f out/macos/playground.pkg -t macos --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-store
          path: out/macos/playground.pkg

  # iOS: the Xcode project (XcodeGen) around the Rust executable, the
  # user-level E2E in a simulator (XCUITest: taps, the on-screen keyboard)
  # for both apps, and the App Store archive with its checks. Signed,
  # exported and validated by App Store Connect when the secrets exist.
  ios:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: ios-${{ hashFiles('.almide-version', 'apps/playground/compiler/Cargo.lock') }}
      - name: App Store Connect key (when the secrets exist)
        if: env.ASC_KEY_ID != ''
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: E2E (Todo)
        run: tools/package_ios.sh todo e2e
      - name: E2E (playground)
        run: tools/package_ios.sh playground e2e
      - name: E2E (gallery) — what VoiceOver sees, toast, long-press tooltip
        run: tools/package_ios.sh gallery e2e
      - name: E2E (services) — system clipboard, share sheet, document picker
        run: |
          tools/package_ios.sh tests/apps/services e2e
          udid="$(xcrun simctl list devices | grep 'ceangal-e2e' | grep -o '[0-9A-F-]\{36\}' | head -1)"
          [ "$(xcrun simctl pbpaste "$udid")" = "copied by ceangal" ]
      - name: archive (+ export and validate with the secrets)
        run: tools/package_ios.sh playground archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            out/ios/*/e2e/*.png
            out/ios/playground/export/*.ipa

  # Linux: the Flatpak, built offline from the exported Rust project and
  # vendored crates, and checked with Flathub's linter.
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
            ~/.local/share/flatpak
          key: flatpak-${{ hashFiles('.almide-version', 'apps/playground/compiler/Cargo.lock') }}
      - name: flatpak tooling
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder dbus desktop-file-utils python3-aiohttp python3-tomlkit
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.freedesktop.Sdk.Extension.rust-stable//26.08 org.flatpak.Builder
      - name: build + lint
        run: |
          # flathub-build installs dependencies through flatpak, which wants a
          # session bus (none on a headless runner)
          dbus-run-session -- tools/build_flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: out/flatpak/io.github.almide.playground.flatpak

  # Android: both apps as signed AABs (upload key from secrets, else a debug
  # key) + universal APKs, 16 KB-aligned; E2E on an x86_64 emulator (KVM):
  # Todo app, and the playground compiling, running and hosting the Todo
  # program on the device.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rust-src
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: android-${{ hashFiles('.almide-version', 'apps/playground/compiler/Cargo.lock') }}
      - name: SDK platform, build tools, NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" >/dev/null
      - name: upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: build (AAB + APK, both ABIs)
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: tools/build_android.sh todo && tools/build_android.sh playground && tools/build_android.sh tests/apps/services x86_64 && tools/build_android.sh gallery x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            out/android/*.aab
            out/android/*.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: node tests/e2e/android.mjs && node tests/e2e/android_services.mjs && node tests/e2e/android_gallery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android
          path: |
            out/e2e/android-*.png
            out/e2e/android-*.log

  # The framework as an app author meets it: the ceangal CLI makes a new
  # app outside this repository, builds it for the web (opened in headless
  # Chrome, clicked) and as a sandboxed Mac app (started once), and
  # `ceangal dev` rebuilds it on edits (tests/e2e/dev.mjs).
  framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: framework-${{ hashFiles('.almide-version', 'cli/almide.toml') }}
      - name: ceangal new
        run: |
          pip3 install --quiet --break-system-packages pillow
          cd "$RUNNER_TEMP" && CEANGAL_SDK="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/ceangal" new hello-app --id dev.example.hello
      - name: web build, in headless Chrome
        run: |
          tools/ceangal build web --app "$RUNNER_TEMP/hello-app"
          node tests/e2e/smoke_web.mjs "$RUNNER_TEMP/hello-app/build/web" --click Count --expect 1 --shot out/framework-web.png
      - name: Mac app (arm64), started once
        run: |
          MAC_ARCHS=arm64 tools/ceangal build macos --app "$RUNNER_TEMP/hello-app"
          CEANGAL_EXIT_AFTER_MS=3000 "$RUNNER_TEMP/hello-app/build/macos/Hello App.app/Contents/MacOS/hello"
      - name: platform services (storage, secrets, HTTP) and an app's own native / JS extension
        run: |
          tools/ceangal build web --app tests/apps/services
          node tests/e2e/smoke_web.mjs tests/apps/services/build/web --click Save --expect "saved+secret"
          node tests/e2e/smoke_web.mjs tests/apps/services/build/web --expect "twice 42 6"
          node tests/e2e/smoke_web.mjs tests/apps/services/build/web --expect "asset: bundled words"
          tools/ceangal build native --app tests/apps/services
      - name: the standard controls (apps/gallery) in Chrome, by pointer, keyboard and accessibility tree
        run: |
          tools/ceangal build web --app apps/gallery
          node tests/e2e/gallery.mjs out/gallery/web --shots out/framework-gallery
      - name: ceangal test (the reference apps' and the new app's tests, web and native)
        run: |
          tools/ceangal test --app apps/gallery
          tools/ceangal test --app apps/todo
          tools/ceangal test --app "$RUNNER_TEMP/hello-app"
          # a failing step fails the run and names the line
          printf 'tap "Count"\nsee "42"\n' > "$RUNNER_TEMP/hello-app/tests/wrong.test"
          ! tools/ceangal test web --app "$RUNNER_TEMP/hello-app" > out.txt 2>&1
          grep -q 'wrong.test:2: see "42"' out.txt
          rm "$RUNNER_TEMP/hello-app/tests/wrong.test"
      - name: size and startup budgets (tests/perf/budgets.json)
        run: node tests/perf/budgets.mjs gallery=out/gallery/web todo=out/web hello="$RUNNER_TEMP/hello-app/build/web"
      - name: ceangal dev (web) — an edit reloads the page, a broken one shows its error
        run: node tests/e2e/dev.mjs
      - name: ceangal dev (macos) — an edit restarts the app
        run: node tests/e2e/dev.mjs --desktop
      - name: ceangal --version, ceangal doctor
        run: |
          tools/ceangal --version | grep -Eq '^ceangal [0-9]+\.[0-9]+\.[0-9]+$'
          tools/ceangal doctor web --app apps/todo
          tools/ceangal doctor --app apps/todo
      - name: errors name the problem
        run: |
          tests/cli/manifest_check.sh
          ! tools/ceangal info --app /nonexistent 2>err.txt && grep -q "no such directory" err.txt
          ! tools/ceangal build nowhere --app apps/todo 2>err.txt && grep -q "unknown build target" err.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework
          path: |
            out/framework-*.png
            out/framework-gallery/*.png

  # The web playground: compiler wasm, app wasm, real-browser E2E, the old
  # playground's fixtures, and (on main) the GitHub Pages deploy.
  web:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen-cli@0.2.129 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/playground/compiler/target
          key: compiler-wasm-${{ runner.os }}-${{ hashFiles('apps/playground/compiler/Cargo.lock') }}
      - name: compiler service tests (bundled packages, GUI programs)
        working-directory: apps/playground/compiler
        run: cargo test --release --lib
      - name: the Todo example is the Todo app
        run: cmp apps/todo/src/main.almd apps/playground/assets/examples/todo/main.almd
      - name: build dist/web (compiler + app + closure-stub check)
        run: tools/build_web.sh
      - name: playground E2E (headless Chrome, WebGPU)
        run: SKIP_BUILD=1 node tests/e2e/web.mjs
      - name: fixtures and examples, native vs playground
        run: SKIP_BUILD=1 node tests/e2e/fixtures.mjs
      - name: the real page (index.html, real input, user GUI window)
        run: SKIP_BUILD=1 node tests/e2e/page.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-web
          path: out/e2e/*.png
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist/web }

  pages:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # The deployed site, in a real browser.
  pages-e2e:
    needs: pages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/e2e/page.mjs --url https://almide-graphics.github.io/ceangal2/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-pages
          path: out/e2e/page-*.png
