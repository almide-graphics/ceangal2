name: ci

# TEMPORARY probe (not for merge): #3's code on almide develop 7e5994cf
# (source build) vs main on v0.67.1, editor-10k-scrolled, same workflow run.
on:
  pull_request:

jobs:
  almide-develop:
    runs-on: macos-15
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked --git https://github.com/almide/almide --rev 7e5994cfc94edc211de24a819a7694a26df8760d almide --root "$RUNNER_TEMP/dev"
      - uses: actions/upload-artifact@v4
        with: { name: almide-develop, path: "${{ runner.temp }}/dev/bin/almide" }

  pixel:
    needs: almide-develop
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        what: [pr3-develop, main-0.67.1]
        rep: [1, 2, 3]
        include:
          - { what: pr3-develop, ref: 7b93b54b097052700ca9b4056824b8a0c9bac9aa, almide: develop }
          - { what: main-0.67.1, ref: probe/main-tonode, almide: 0.67.1 }
    name: pixel ${{ matrix.what }} \#${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ matrix.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        if: matrix.almide == 'develop'
        with: { name: almide-develop, path: "${{ runner.temp }}/dev" }
      - name: toolchain
        run: |
          if [ "${{ matrix.almide }}" = develop ]; then
            echo dev > .almide-version
            mkdir -p .tools/dev/almide-macos-aarch64
            cp "$RUNNER_TEMP/dev/almide" .tools/dev/almide-macos-aarch64/almide
            chmod +x .tools/dev/almide-macos-aarch64/almide
          else
            echo "${{ matrix.almide }}" > .almide-version
          fi
          tools/almide --version
      - name: pixels and bench
        continue-on-error: true
        run: node tests/pixel/run.mjs 2>&1 | tee pixel.txt
      - if: always()
        run: grep -E 'bench:' pixel.txt || true
