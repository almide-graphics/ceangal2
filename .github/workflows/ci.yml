name: ci

# TEMPORARY probe (not for merge): why snaidhm.vector.rasterize_svg hangs on
# wasm. Times each repro natively and on wasm, on almide develop 7e5994cf.
on:
  pull_request:

jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked --git https://github.com/almide/almide --rev 7e5994cfc94edc211de24a819a7694a26df8760d almide --root "$RUNNER_TEMP/dev"
      - run: brew install wasmtime coreutils || true
      - name: time each repro, native then wasm (300 s cap each)
        working-directory: svgprobe
        run: |
          A="$RUNNER_TEMP/dev/bin/almide"
          "$A" --version
          for f in b1_direct.almd b2_forward.almd b3_small.almd; do
            for t in native wasm; do
              args=""; [ $t = wasm ] && args="--target wasm"
              "$A" build "$f" $args -o "/tmp/x-$t" >/dev/null 2>&1 || echo "BUILD FAILED $f $t"
              s=$(date +%s)
              gtimeout 600 "$A" run "$f" $args 2>&1 | tail -4
              echo "RESULT $f $t exit=${PIPESTATUS[0]} seconds=$(( $(date +%s) - s ))"
            done
          done
