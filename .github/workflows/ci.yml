name: ci

# TEMPORARY probe (not for merge): the web playground's SVG step. Times
# snaidhm.vector.rasterize_svg (64/256/1024 px) and the mut-Bytes repros,
# native and wasm, on almide #4581 head, develop, and (main's snaidhm) v0.67.1.
on:
  pull_request:

jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { what: pr3-on-4581, src: probe/svg2, almide: cdfd3dc378554261ab28ff4246debf222f1476d8 }
          - { what: pr3-on-develop, src: probe/svg2, almide: 166eb38b694b9ccebdb68646f589b8a6647efe32 }
          - { what: main-on-0.67.1, src: main, almide: "0.67.1" }
    name: ${{ matrix.what }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe/svg2, path: probe }
      - uses: actions/checkout@v4
        with: { ref: "${{ matrix.src }}", path: src }
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install wasmtime coreutils || true
      - name: almide
        run: |
          if [ "${{ matrix.almide }}" = 0.67.1 ]; then
            mkdir -p "$RUNNER_TEMP/a" && curl -fsSL https://github.com/almide/almide/releases/download/v0.67.1/almide-macos-aarch64.tar.gz | tar xz -C "$RUNNER_TEMP/a"
            echo "A=$RUNNER_TEMP/a/almide-macos-aarch64/almide" >> "$GITHUB_ENV"
          else
            cargo install --locked --git https://github.com/almide/almide --rev "${{ matrix.almide }}" almide --root "$RUNNER_TEMP/dev"
            echo "A=$RUNNER_TEMP/dev/bin/almide" >> "$GITHUB_ENV"
          fi
      - name: time each program, native then wasm (300 s cap each)
        run: |
          "$A" --version
          mkdir -p src/svgprobe/src
          cp probe/svgprobe/almide.toml src/svgprobe/
          cp probe/svgprobe/src/main.almd src/svgprobe/src/
          if [ "${{ matrix.almide }}" != 0.67.1 ]; then cp probe/svgprobe/*.almd src/svgprobe/; fi
          cd src/svgprobe
          for f in $(ls *.almd 2>/dev/null) src/main.almd; do
            for t in native wasm; do
              args=""; [ $t = wasm ] && args="--target wasm"
              s=$(date +%s)
              gtimeout 300 "$A" run "$f" $args > out.txt 2>&1; rc=$?
              tail -4 out.txt
              echo "RESULT $f $t exit=$rc seconds=$(( $(date +%s) - s ))"
            done
          done
