name: ci

# TEMPORARY probe (not for merge): hello / todo / gallery wasm sizes after
# wasm-opt per size cut, on almide develop 7e5994cf (source build).
on:
  pull_request:

jobs:
  almide-develop:
    runs-on: macos-15
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked --git https://github.com/almide/almide --rev 7e5994cfc94edc211de24a819a7694a26df8760d almide --root "$RUNNER_TEMP/dev"
      - uses: actions/upload-artifact@v4
        with: { name: almide-develop, path: "${{ runner.temp }}/dev/bin/almide" }

  sizes:
    needs: almide-develop
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { what: base, ref: 7b93b54b097052700ca9b4056824b8a0c9bac9aa }
          - { what: v1-plain-wheel-context, ref: 172c58f1fe4e688155e1748cded37f40b5e6f81b }
          - { what: v2-dispatch-split, ref: 207e93a7e1168e514449de7f0a53b012b188943e }
    name: sizes ${{ matrix.what }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ matrix.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with: { name: almide-develop, path: "${{ runner.temp }}/dev" }
      - name: toolchain
        run: |
          echo dev > .almide-version
          mkdir -p .tools/dev/almide-macos-aarch64
          cp "$RUNNER_TEMP/dev/almide" .tools/dev/almide-macos-aarch64/almide
          chmod +x .tools/dev/almide-macos-aarch64/almide
      - name: web builds and sizes
        run: |
          pip3 install --quiet --break-system-packages pillow
          (cd "$RUNNER_TEMP" && CEANGAL_SDK="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/ceangal" new hello-app --id dev.example.hello)
          tools/ceangal build web --app "$RUNNER_TEMP/hello-app"
          tools/ceangal build web --app apps/gallery
          tools/ceangal build web --app apps/todo
          find . "$RUNNER_TEMP/hello-app" -name '*.wasm' -path '*/web/*' -not -path './hosts/*' -exec sh -c 'echo "SIZE $(basename "$1") $(wc -c < "$1") $1"' _ {} \;
