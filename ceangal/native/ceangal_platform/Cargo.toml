# Platform services whose crates exist only on some targets. almide's
# [native-deps] cannot be target-specific, so ceangal depends on this crate
# (copied into the generated project's src/ with the rest of native/) and the
# per-target choice is made here. See docs/adr/0004-mobile-hosts.md.
[package]
name = "ceangal_platform"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3"
rfd = "0.15"
keyring = "4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# TalkBack: AccessKit's adapter injected into NativeActivity's view
# (accesskit_winit's Android adapter wants a GameActivity)
accesskit = "0.25"
accesskit_android = { version = "0.9", features = ["embedded-dex"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
security-framework = "3"

# the system's display preferences (ceangal_platform::desktop_prefs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility"] }
